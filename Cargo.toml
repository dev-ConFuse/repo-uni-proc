[package]
name = "repo-uni-proc"
version = "0.1.0"
edition = "2021"
description = "Repository content processing service for ConFuse platform - repository AST analysis and intelligent chunking"
license = "Proprietary"
authors = ["ConFuse Team"]

[lib]
name = "unified_processor_lib"
path = "src/lib.rs"

[[bin]]
name = "unified-processor"
path = "src/main.rs"

[dependencies]
# Extracted from confuse-common
jsonwebtoken = "10.4.0"
validator = { version = "0.20.0", features = ["derive"] }
rsa = "0.10.0-rc.18"
once_cell = "1.21.4"

# Kafka for event streaming
rdkafka = { version = "0.39.0", features = ["naive-runtime", "ssl-vendored"] }

# FalkorDB via Redis protocol
redis = { version = "0.25", features = ["tokio-comp", "tokio-rustls-comp"] }
bb8-redis = "0.15"

# Web framework
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.52.3", features = ["full"] }
futures = "0.3.32"
futures-util = "0.3.32"
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }

# Serialization
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.150"




# Database — PostgreSQL for metadata
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "macros"] }

# HTTP client (for service calls, Azure Blob REST API, web scraping)
reqwest = { version = "0.13.4", features = ["json", "stream", "gzip", "brotli"] }

# Repository cloning — done via subprocess git, no libgit2 needed
# git2 removed: it pulled in openssl-sys (requires system OpenSSL on Windows)


# Configuration
config = "0.15.24"
dotenvy = "0.15.7"

# Python embedding removed to keep service purely native Rust and lightweight

# Utils
num_cpus = "1.17.0"
uuid = { version = "1.23.3", features = ["v4", "v5", "v3", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
tracing-appender = "0.2.5"
anyhow = "1.0.102"
thiserror = "2.0.18"
regex = "1.12.4"
bytes = "1.12.0"
async-trait = "0.1.89"
base64 = "0.22.1"

# Concurrency
dashmap = "7.0.0-rc2"
lazy_static = "1.5.0"

# gRPC removed - using HTTP for auth, Kafka for data processing

# Graph database is FalkorDB (via Redis protocol)

# Temporary storage
tempfile = "3.27.0"
sha2 = "0.11.0"
petgraph = { version = "0.8.3", features = ["serde-1"] }
strsim = "0.11.1"
fnv = "1.0.7"
walkdir = "2.5.0"
unicode-normalization = "0.1.25"
md5 = "0.8.0"
tree-sitter = "0.26.9"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-go = "0.25.0"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-c = "0.24.2"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.24.2"
tree-sitter-swift = "0.7.3"
tree-sitter-kotlin = { package = "tree-sitter-kotlin-ng", version = "*" }
tree-sitter-scala = "0.26.0"
tree-sitter-bash = "0.25.1"
tree-sitter-html = "0.23.2"
tree-sitter-md = "0.5.3"

[dev-dependencies]
# Tests moved to ConFuse-test-module (Python API tests)

[build-dependencies]
# No build dependencies needed - removed gRPC proto generation

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[features]
default = ["kafka"]
# kafka: enables Kafka event publishing via rdkafka.
kafka = []
